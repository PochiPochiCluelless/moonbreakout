<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moon breakout</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#cfd1ce;--hole:#a9aca8;--panel:#e8e9e6;--ink:#23252b;--muted:#5b5e64;--accent:#8a4b2f;
--font:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a1e;--hole:#121014;--panel:#2e2b33;--ink:#efece8;--muted:#aaa6ae;--accent:#f0a070}}
:root[data-theme="dark"]{--bg:#1c1a1e;--hole:#121014;--panel:#2e2b33;--ink:#efece8;--muted:#aaa6ae;--accent:#f0a070}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:14px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:14px 12px 28px;font-family:var(--font);color:var(--ink);line-height:1.6;background-color:var(--bg);
background-image:radial-gradient(circle at center,var(--hole) 0 3px,transparent 4px);background-size:120px 120px}
.wrap{max-width:420px;margin:0 auto}
.panel{background:var(--panel);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px}
.stage{position:relative;overflow:hidden;container-type:inline-size;border:2px solid #0b0a0e;background:#101018;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{display:block;width:100%;height:auto}
[hidden]{display:none!important}.ov.ttl{background:#000}.ov.ttl .box{background:none;border:0;box-shadow:none;color:#fff3e4}.ov.ttl{align-items:flex-end;padding-bottom:40px}.ov.ttl .timg{position:absolute;top:0;left:0;right:0;height:66%;background-size:cover;background-position:center top;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}.ov.ttl h2,.ov.ttl button{position:relative;z-index:2}.ov.ttl h2{text-shadow:0 0 8px #000,0 0 3px #000}.ov.end{padding:0;background:#000}.ov.end .box{background:none;border:0;box-shadow:none;padding:0;max-width:none;width:100%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff3e4}.eimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42}.erc{position:absolute;left:0;right:0;top:0;text-align:center;padding:0 16px;font-size:12px;font-size:clamp(10px,calc((100cqw - 32px)/22),14px);line-height:2.1;text-shadow:0 0 6px #000,0 0 3px #000}.erc p{margin:0;white-space:nowrap}.erb{position:absolute;z-index:2;right:8px;bottom:8px;display:flex;gap:6px}.fin{position:relative;z-index:1;font-size:2.2rem;letter-spacing:.3em;padding-left:.3em;text-shadow:0 0 8px #000,0 0 3px #000}.erb button{min-height:36px;padding:4px 10px;font-size:.8rem}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,14,.7);padding:10px}
.box{background:var(--panel);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;max-width:92%;text-align:center}
.box h2{font-size:1.5rem;margin:0 0 6px;font-weight:400;letter-spacing:.08em;line-height:1.3}
.box p{margin:0 0 6px}.hint{color:var(--muted);font-size:.82rem}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:8px 14px;min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;justify-content:center;align-items:stretch;margin-top:10px}
.fc{display:flex;flex-direction:column;align-items:center;gap:0;padding:4px 8px;flex:0 0 auto;line-height:1.2;font-size:.8rem}
.fc img{width:44px;height:44px;image-rendering:pixelated}
.fc.on{background:var(--accent);color:#fff}.fc small{font-size:.7rem;opacity:.85}.inf .box{font-size:clamp(11px,calc((100cqw - 90px)/16),15px);line-height:1.8;white-space:nowrap}.inf h3{margin:2px 0 4px;font-weight:600;font-size:1.15em}.inf p{margin:0 0 6px}.inf .sp2{color:var(--accent);font-weight:600}.inf img{display:block;margin:0 auto;image-rendering:pixelated}
#sp{flex:1;position:relative;overflow:hidden}#sp span{position:relative}#sp i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);opacity:.45}#sp.rdy{background:var(--accent);color:#fff}#sp.rdy i{opacity:0}
</style>
</head>

function draw(){g.save();if(shk>0)g.translate((Math.random()-.5)*shk*.6,(Math.random()-.5)*shk*.6);const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0e0d18');gr.addColorStop(1,'#231d33');g.fillStyle=gr;g.fillRect(0,0,W,H);
g.fillStyle='rgba(255,243,228,.5)';for(let i=0;i<30;i++)g.fillRect((i*97)%W,(i*53)%(PY-60),1.5,1.5);
for(const k of bricks){if(!k.hp)continue;g.fillStyle=PAL[k.r%7];g.fillRect(k.x,k.y,BW-2,BH);g.fillStyle='rgba(255,255,255,.28)';g.fillRect(k.x,k.y,BW-2,3);
if(k.hp>1){g.strokeStyle='#fff3e4';g.lineWidth=2;g.strokeRect(k.x+1,k.y+1,BW-4,BH-2)}}
if(slash){g.fillStyle='rgba(255,243,228,'+slash.t/18+')';g.fillRect(0,slash.y-3,W,BH+6)}
for(const i of items){g.fillStyle={w:'#7fa88a',m:'#6f94b0',l:'#c9785a',s:'#9a82b0',p:'#e0a040'}[i.t];g.beginPath();g.arc(i.x,i.y,8,0,7);g.fill();g.fillStyle='#fff';g.font='600 11px sans-serif';g.textAlign='center';g.fillText(i.t==='p'?'★':i.t,i.x,i.y+4)}
if(boss&&boss.hp>0){const im=IM.monk;if(im.complete&&im.naturalWidth){const bh=64,bw=im.naturalWidth*bh/im.naturalHeight;if(boss.inv>0&&T%4<2)g.globalAlpha=.5;g.drawImage(im,boss.x-bw/2,48,bw,bh);g.globalAlpha=1}g.fillStyle='rgba(200,160,255,.25)';g.fillRect(10,40,W-20,5);g.fillStyle='#c8a0ff';g.fillRect(10,40,(W-20)*boss.hp/boss.max,5)}for(const o of ob){g.fillStyle='#8a5ad0';g.beginPath();g.arc(o.x,o.y,6,0,7);g.fill();g.fillStyle='#e8d0ff';g.beginPath();g.arc(o.x,o.y,2.5,0,7);g.fill()}for(const h of hats){if(h.d>0)continue;g.save();g.translate(h.x,h.y);g.rotate(h.r);g.fillStyle='#d9a35b';g.beginPath();g.ellipse(0,0,11,4,0,0,7);g.fill();g.fillStyle='#b8823f';g.beginPath();g.arc(0,-2,6,Math.PI,0);g.fill();g.restore()}for(const p of pz){const s=.7+(12-p.t)/12*.5;g.save();g.translate(p.x,p.y);g.scale(s,s);g.globalAlpha=p.t/12;g.fillStyle='#ffb08a';g.beginPath();g.ellipse(0,4,9,7,0,0,7);g.fill();for(const[a,b]of[[-9,-6],[-3,-11],[3,-11],[9,-6]]){g.beginPath();g.arc(a,b,3.5,0,7);g.fill()}g.restore()}
const pw=pwid(),im=IM[ch];g.imageSmoothingEnabled=false;
if(im.complete&&im.naturalWidth){const h=ch==='pochi'?36:48,w=im.naturalWidth*h/im.naturalHeight;g.drawImage(im,px-w/2,PY-h+2+Math.sin(T/12)*1,w,h)}
g.fillStyle=sh>0?'#8a5ad0':C().col;g.fillRect(px-pw/2,PY,pw,8);g.fillStyle='#8a4b2f';g.fillRect(px-pw/2,PY+6,pw,2);
for(const b of balls){g.fillStyle=C().col;g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}
for(const p of parts){g.fillStyle=p.c;g.globalAlpha=p.l/22;g.fillRect(p.x,p.y,3,3);g.globalAlpha=1}
g.fillStyle='#fff3e4';g.font='600 13px "Shippori Mincho",serif';g.textAlign='left';g.fillText('score '+String(score).padStart(6,'0'),10,20);
g.textAlign='center';g.fillText('stage '+Math.min(stage+1,STAGES)+' / '+STAGES,W/2+30,20);g.textAlign='right';g.fillText('♥'.repeat(lives),W-10,20);
g.fillStyle='rgba(255,243,228,.2)';g.fillRect(10,30,W-20,5);g.fillStyle=gauge>.999?'#f0a070':'#d9a35b';g.fillRect(10,30,(W-20)*gauge,5);
if(tt>0){g.globalAlpha=Math.min(1,tt/30);g.textAlign='center';g.font='600 15px "Shippori Mincho",serif';g.fillStyle='#fff3e4';g.fillText(toast,W/2,PY-70);g.globalAlpha=1}if(tipT>0){g.save();g.globalAlpha=Math.min(1,tipT/30);g.textAlign='center';g.font='600 12px "Shippori Mincho",serif';g.fillStyle='#fff3e4';g.fillText('ダブルクリックで一時停止',W/2,PY-96);g.restore()}if(bn){const k=Math.min(1,bn.t/20),s=1+Math.max(0,bn.t-90)/20*.4;g.save();g.globalAlpha=k;g.translate(W/2,H/2-30);g.scale(s,s);g.textAlign='center';g.font='600 30px "Shippori Mincho",serif';g.lineWidth=5;g.strokeStyle='#0b0a0e';g.strokeText(bn.s,0,0);g.fillStyle=bn.c;g.fillText(bn.s,0,0);g.restore()}g.restore()}
let acc=0,last=performance.now();
function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=16.67){if(!paused)update();acc-=16.67}draw();requestAnimationFrame(loop)}
function setX(e){const r=cv.getBoundingClientRect();px=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',e=>{setX(e);const n=performance.now();if(n-lastTap<300)pauseWin();else if(st==='play')launch();lastTap=n});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)setX(e)});
addEventListener('keydown',e=>{const k=e.key;if((k==='e'||k==='E')&&st==='title'&&!ov.hidden){ending();return}if(k==='p'||k==='P'){pauseWin();return}if(k==='ArrowLeft'||k==='a')keys.l=1;else if(k==='ArrowRight'||k==='d')keys.r=1;
else if(k===' '){special();e.preventDefault()}else if(k==='Enter'&&st==='play')launch();if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')keys.l=0;if(k==='ArrowRight'||k==='d')keys.r=0});
spB.onclick=special;const ttB=document.getElementById('tt');let tbT=0;ttB.onclick=()=>{if(tbT){tbT=0;ttB.textContent='title';toTitle()}else{tbT=1;ttB.textContent='title?';setTimeout(()=>{tbT=0;ttB.textContent='title'},2500)}};
const CI={bisco:['パドルが広い','ボールはゆっくり','安定して打ち返せる'],moon:['パドルが狭い','ボールが速い','2段ブロックも一撃','打ち返すとほぼ真上へ'],pochi:['パドルはふつう','ボールはゆっくり','アイテムが出やすい','specialが7回でたまる']};
const CS={bisco:['special「反射の文学」','帽子が壁とブロックで跳ね返る'],moon:['special「どいつもこいつも」','下の段から2回斬る'],pochi:['special「肉球百裂拳」','肉球が8回落ちる']};
const ov2=$('ov2');
function info(k){paused=true;ov2.innerHTML='<div class="box"><img src="'+A[k+'_f']+'" width="56" height="56" alt="">'+'<h3>'+k+'</h3><p>'+CI[k].join('<br>')+'</p><p class="sp2">'+CS[k].join('<br>')+'</p><p class="hint">タップで再開</p></div>';ov2.hidden=false}
ov2.onclick=()=>{ov2.hidden=true;paused=false};function pauseWin(){if(st!=='play'||paused)return;paused=true;ov2.innerHTML='<div class="box"><h3>pause</h3><p class="hint">タップで再開</p></div>';ov2.hidden=false}
for(const k of['bisco','moon','pochi']){const b=document.createElement('button');b.className='fc'+(k===ch?' on':'');b.innerHTML='<img src="'+A[k+'_f']+'" alt="">'+k;
b.onclick=()=>{ch=k;info(k);[...fcs.children].forEach(x=>x.classList.toggle('on',x===b))};fcs.appendChild(b)}
toTitle();

requestAnimationFrame(loop);
})();
